# MDC submission metadata (dry-run ready). Archive = open layer only
# (dev references + test inputs + contrastive). Hidden split and
# withheld test references are never uploaded.
file_path: open-v1.1.tar.gz
datasheet_path: DATASHEET.md

name: Prompsit D4 - Document-structure Integrity
shortDescription: >-
  Checks whether translated HTML documents preserve their element structure, tables,
  links and images.

longDescription: >-
  Translating a document should preserve its structure as well as its text. This dataset
  checks the arrangement of elements such as headings, paragraphs and lists, the
  structure of tables, and the destinations of links and images in translated HTML.

  The documents are built from software translation examples placed in a small set of
  templates. Automated checks compare the original and translated structures and check
  that the document follows the required syntax. They do not assess visual appearance or
  translation accuracy. Moving translated text into the wrong paragraph or table cell
  can still pass if the structure stays the same.

  Translations are from English into Catalan, Spanish, French, Italian, European
  Portuguese, German, Dutch, Polish and Russian. The full dataset contains 160 source
  examples and 1,440 records, including withheld data.

  The download includes a small development set with reference translations for trying
  out the checks, test inputs without their reference answers, and example pairs showing a reference alongside a deliberately damaged version. Some evaluation data is withheld. See DATASHEET.md for
  the scoring rules, sources and limitations.

