intendedUsage: >-
  Test translation tools used for software and other text containing tags or
  placeholders. Use the results alongside a separate assessment of translation quality.

ethicalReviewProcess: >-
  The examples use software translation catalogs with licenses that allow reuse.
  Generated additions are documented, and source credits are included. Reference
  examples are checked automatically; an independent human review of the complete
  dataset has not been conducted.

