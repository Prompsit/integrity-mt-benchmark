# MDC submission metadata (dry-run ready). Archive = open layer only
# (dev references + test inputs + contrastive). Hidden split and
# withheld test references are never uploaded.
file_path: open-v1.1.tar.gz
datasheet_path: DATASHEET.md

name: Prompsit D1 - Inline Asset Integrity
shortDescription: >-
  Checks whether machine translation keeps tags, placeholders and protected text intact.

longDescription: >-
  Software text often contains more than words. It may include tags that mark bold text,
  placeholders such as {name}, or a web address that must stay unchanged. This dataset
  checks whether a translation preserves the supported elements and their syntax.

  The examples come from software translation catalogs, with some markup added to cover
  more cases. The checks can detect missing or damaged elements. They do not determine
  whether every tag surrounds the right words or whether the translation itself is
  accurate.

  Translations are from English into Catalan, Spanish, French, Italian, European
  Portuguese, German, Dutch, Polish and Russian. The full dataset contains 599 source
  examples and 5,391 records, including withheld data.

  The download includes a small development set with reference translations for trying
  out the checks, test inputs without their reference answers, and example pairs showing a reference alongside a deliberately damaged version. Some evaluation data is withheld. See DATASHEET.md for
  the scoring rules, sources and limitations.

