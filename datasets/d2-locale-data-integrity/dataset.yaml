# MDC submission metadata (dry-run ready). Archive = open layer only
# (dev references + test inputs + contrastive). Hidden split and
# withheld test references are never uploaded.
file_path: open-v1.1.tar.gz
datasheet_path: DATASHEET.md

name: Prompsit D2 - Locale-data Integrity
shortDescription: >-
  Checks number, date, currency and unit formatting in machine translation for nine
  regional language settings.

longDescription: >-
  Numbers and dates can be written differently across languages and regions. For
  example, the English decimal number 12.5 is written as 12,5 in French. This dataset
  checks whether a translation uses an accepted format for the requested language and
  region.

  Each example adds one number, date, currency amount or measurement in square brackets
  to a sentence from software translation catalogs. Expected formats come from Unicode
  CLDR, a collection of language and regional conventions. The check covers the
  bracketed value only. Amounts and units stay the same; currency and measurement
  conversions are outside the task.

  Translations are from English into Catalan, Spanish, French, Italian, European
  Portuguese, German, Dutch, Polish and Russian. The full dataset contains 680 source
  examples and 6,120 records, including withheld data.

  The download includes a small development set with reference translations for trying
  out the checks, test inputs without their reference answers, and example pairs showing a reference alongside a deliberately damaged version. Some evaluation data is withheld. See DATASHEET.md for
  the scoring rules, sources and limitations.

