intendedUsage: >-
  Test whether translation tools format numbers, dates, currencies and units for the
  requested language and region. The tool must keep the bracketed value in its output.

ethicalReviewProcess: >-
  The examples use software translation catalogs with licenses that allow reuse and
  Unicode CLDR language data. Generated additions are documented, and source credits are
  included. Reference examples are checked automatically; an independent human review of
  the complete dataset has not been conducted.

