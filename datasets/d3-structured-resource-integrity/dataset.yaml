# MDC submission metadata (dry-run ready). Archive = open layer only
# (dev references + test inputs + contrastive). Hidden split and
# withheld test references are never uploaded.
file_path: open-v1.1.tar.gz
datasheet_path: DATASHEET.md

name: Prompsit D3 - Structured-resource Integrity
shortDescription: >-
  Checks whether translated software resource files keep their structure, identifiers
  and protected fields.

longDescription: >-
  Software stores text in resource files: files that pair an identifier with text shown
  to users. For example, save_button identifies a button, while Save is its label. When
  translating the label into Spanish as Guardar, the identifier must remain unchanged.
  This dataset checks these kinds of requirements.

  The examples use Android software translations arranged into small XML, JSON,
  properties and ARB files. Checks cover file syntax, identifiers, whether values remain text and
  protected fields. They also flag unchanged source text where the reference translation
  uses different wording. Passing does not establish translation accuracy or guarantee
  that a complete application can load the file.

  Translations are from English into Catalan, Spanish, French, Italian, European
  Portuguese, German, Dutch, Polish and Russian. The full dataset contains 420 source
  examples and 3,780 records, including withheld data.

  The download includes a small development set with reference translations for trying
  out the checks, test inputs without their reference answers, and example pairs showing a reference alongside a deliberately damaged version. Some evaluation data is withheld. See DATASHEET.md for
  the scoring rules, sources and limitations.

