# MDC submission metadata. Archive = open layer only
# (dev reference + test inputs + contrastive). Hidden split is never uploaded.
file_path: open-v1.1.tar.gz
datasheet_path: DATASHEET.md

name: Prompsit D5 - Linguistic-resource Adherence
shortDescription: >-
  Checks whether translations use prescribed terms supplied through a glossary or
  translation memory.

longDescription: >-
  Translation workflows may receive a glossary of required terms or a translation
  memory: previously translated sentences provided for reuse. This dataset checks
  whether the output uses the prescribed term, repeats it when required, and avoids
  terms explicitly listed as disallowed.

  The examples combine software translation sentences with added term fields and
  constructed glossary or translation-memory examples. Some cases include an outdated
  suggested term or conflicting instructions. Glossary and translation-memory results
  are reported separately. The checks assess term use, not reuse of an entire sentence
  or overall translation quality.

  Translations are from English into Catalan, Spanish, French, Italian, European
  Portuguese, German, Dutch, Polish and Russian. The full dataset contains 510 source
  examples and 4,590 records, including withheld data.

  The download includes a small development set with reference translations for trying
  out the checks, test inputs without their reference answers, and example pairs showing a reference alongside a deliberately damaged version. Some evaluation data is withheld. See DATASHEET.md for
  the scoring rules, sources and limitations.

